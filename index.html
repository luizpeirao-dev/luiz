<!DOCTYPE html>
<html>
<head>
    <title>declaração de amor </title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #121212;
            color: white;
        }

        /* MENU */
        header {
            background-color: #1f1f1f;
            padding: 15px;
            text-align: center;
        }

        header a {
            color: #ff0000;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        header a:hover {
            text-decoration: underline;
        }

        /* CONTEÚDO */
        .container {
            padding: 40px;
            text-align: center;
        }

        .card {
            background-color: #1e1e1e;
            padding: 20px;
            margin: 20px auto;
            width: 300px;
            border-radius: 10px;
        }

        button {
            background-color: #ff0000;
            border: none;
            padding: 10px;
            cursor: pointer;
        }

        /* RODAPÉ */
        footer {
            background-color: #1f1f1f;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>

</head>
<body>

    <!-- MENU -->
    <header>
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Contato</a>
    </header>

    <!-- CONTEÚDO -->
    <div class="container">
        <h1>eu te amo bia </h1>
        <p>agora tenho uma nova forma de declarar meu amor 😍</p>

        <div class="card">
            <h2>Projeto casamento</h2>
            <p>tudo que eu quero </p>
            <button onclick="clicou()">Ver mais</button>
        </div>

        <div class="card">
            <h2>ter filhos </h2>
            <p>a parte mais legal do casamento </p>
            <button onclick="clicou()">Ver mais</button>
        </div>
    </div>

    <!-- RODAPÉ -->
    <footer>
        <p>© 2026 - Meu site</p>
    </footer>

    <script>
        function clicou() {
            alert("Você clicou em um projeto!");
        }
    </script>

</body>
</html>
